apiVersion: batch/v1
kind: Job
metadata:
  name: mongo-init-job
spec:
  template:
    spec:
      initContainers:
        - name: wait-for-mongo
          image: busybox
          command:
            - sh
            - -c
            - |
              until nc -z mongo-svc 27017; do
                echo "Waiting for MongoDB..."
                sleep 5
              done
      
      containers:
        - name: mongo-init
          image: mongo:6
          env:
            - name: MONGO_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mongo-secret
                  key: mongo-root-username
            - name: MONGO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mongo-secret
                  key: mongo-root-password
            - name: MONGO_USER
              valueFrom:
                secretKeyRef:
                  name: mongo-secret
                  key: mongo-user
            - name: MONGO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mongo-secret
                  key: mongo-password
          command: ["sh", "-c"]
          args:
            - |
              mongosh --host mongo-svc:27017 -u $MONGO_ROOT_USERNAME -p $MONGO_ROOT_PASSWORD --authenticationDatabase admin <<EOF
              use solarsystem;
              db.createUser({user: "$MONGO_USER", pwd: "$MONGO_PASSWORD", roles: [{role: "readWrite", db: "solarsystem"}]});
              db.planets.insertMany([
                { id: 1, name: 'Mercury', description: 'Mercury is the smallest planet in our solar system and closest to the Sun.', image: '/images/mercury.png', velocity: '47.87 km/s', distance: '57.9 million km from Sun' },
                { id: 2, name: 'Venus', description: 'Venus is the second planet from the Sun and is the hottest planet in the solar system.', image: '/images/venus.png', velocity: '35.02 km/s', distance: '108.2 million km from Sun' },
                { id: 3, name: 'Earth', description: 'Earth is the third planet from the Sun and the only astronomical object known to harbor life.', image: '/images/earth.png', velocity: '29.78 km/s', distance: '149.6 million km from Sun' },
                { id: 4, name: 'Mars', description: 'Mars is the fourth planet from the Sun and the second-smallest planet in the Solar System.', image: '/images/mars.png', velocity: '24.07 km/s', distance: '227.9 million km from Sun' },
                { id: 5, name: 'Jupiter', description: 'Jupiter is the fifth planet from the Sun and the largest in the Solar System.', image: '/images/jupiter.png', velocity: '13.07 km/s', distance: '778.5 million km from Sun' },
                { id: 6, name: 'Saturn', description: 'Saturn is the sixth planet from the Sun and the second-largest in the Solar System, after Jupiter.', image: '/images/saturn.png', velocity: '9.69 km/s', distance: '1.434 billion km from Sun' },
                { id: 7, name: 'Uranus', description: 'Uranus is the seventh planet from the Sun and has the third-largest planetary radius.', image: '/images/uranus.png', velocity: '6.81 km/s', distance: '2.871 billion km from Sun' },
                { id: 8, name: 'Neptune', description: 'Neptune is the eighth and farthest known planet from the Sun in the Solar System.', image: '/images/neptune.png', velocity: '5.43 km/s', distance: '4.495 billion km from Sun' }
              ]);
              print("Database 'solarsystem' initialized with user and planet data");
              EOF
      restartPolicy: OnFailure