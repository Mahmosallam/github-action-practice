name: sec-test
on:
  push:
    branches:
    - main

    paths: 
    - "src/**"

  pull_request:
    branches:
    - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: checkout-code
        uses: actions/checkout@v6-beta
     
      - name: test-code
        run: |
          ls
          pwd
          npm version
          npm test 



