name: practice-some-jobs
on:
  workflow_dispatch
jobs:
  job-1:
    runs-on: ubuntu-latest
    steps:
    - run: echo "this is ${{ github.job }}"
  jobs-2:
    runs-on: ubuntu-latest
    needs: job-1
    steps:
    - run: echo "this is ${{ github.job }}"
  jobs-3:
    runs-on: ubuntu-latest
    needs: job-1
    steps:
    - run: echo "this is ${{ github.job }}"
  jobs-4:
    runs-on: ubuntu-latest
    needs: [jobs-2,jobs-3]
    steps:
    - run: echo "this is ${{ github.job }}"    
