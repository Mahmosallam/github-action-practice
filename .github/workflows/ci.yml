name: ci-the-app
on:
  workflow_dispatch:

jobs:
  job-ci:
    runs-on: ubuntu-latest
    steps:
      - name: checkout-the-repo
        uses: actions/checkout@v6-beta
           
      - name: install-dependencies
        run: npm install

      - name: unit-test
        run: npm test

      - name: upload-test-artifact
        uses: actions/upload-artifact@v5.0.0
        with:
          name: test-artifact
          path: test-results.xml
